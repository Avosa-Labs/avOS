# Provider entry point for the gate set.
#
# This file is thin on purpose. It selects hosts and calls the gate script, so
# the definition of "green" lives in the repository at infrastructure/ci/gates.sh
# and a contributor runs exactly what this lane runs. Changing provider changes
# this file and nothing else.
#
# The compiler is obtained through the repository's own bootstrap, which
# resolves and digest-verifies the release pinned in toolchain.lock.json. No
# third-party toolchain action is used: an unpinned action would undermine the
# reproducibility the manifest exists to guarantee.
#
# Two hosts, on pull requests only. Both hosts because the platform must not
# quietly depend on one of them, and a defect specific to an architecture is
# found by building on that architecture or not at all.
#
# Pull requests only because every merge to main is a squash of a branch whose
# head commit this workflow already checked. A push lane re-runs the same tree
# and reports the same answer.

name: gates

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gates-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gates:
    name: gates (${{ matrix.host }})
    runs-on: ${{ matrix.runner }}
    # Headroom for the one-time cold compile of the on-device model engine (llama.cpp and
    # ggml). It compiles once when its pin or the build changes and is reused from the Zig
    # cache on every run in between, so a warm run finishes in a fraction of this; the ceiling
    # only has to let that first cold build finish and populate the cache.
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          # The Linux runner image is pinned, not "latest", so the software Vulkan
          # implementation the correctness lane renders against does not float with the image.
          - host: linux-x86_64
            runner: ubuntu-24.04
          - host: macos-aarch64
            runner: macos-latest

    steps:
      - name: Check out
        uses: actions/checkout@v5
        with:
          # The specification exclusion check distinguishes "untracked" from
          # "absent", so it needs real history rather than a detached blob.
          fetch-depth: 1

      # Cache the downloaded toolchain archive, not the extracted compiler.
      #
      # This is the whole security argument for the cache. Bootstrap re-hashes
      # the archive against the digest pinned in toolchain.lock.json on every
      # run, before extracting it, and skips that check only when the extracted
      # compiler is already present. So we cache the archive and never the
      # extracted tree: a cache hit still passes through the digest verification,
      # and a poisoned cache fails it and stops the build. The key is the
      # manifest's own content, so a different pin is a different cache entry.
      - name: Cache the pinned toolchain archive
        uses: actions/cache@v4
        with:
          path: .tools/download
          key: toolchain-${{ matrix.host }}-${{ hashFiles('toolchain.lock.json') }}

      # Cache Zig's content-addressed compiler caches.
      #
      # Safe by construction: every entry is keyed by the hash of its inputs, so
      # a cache hit is by definition the correct output for those inputs and a
      # tampered entry has a mismatched key that is never read. This is what
      # turns a from-scratch compile into an incremental one. The reproducibility
      # gate is unaffected — it hashes the source tree twice within one job
      # rather than recompiling, so caching cannot make a non-deterministic build
      # falsely agree with itself.
      #
      # The key rotates on the build files and the source hash; restore-keys let
      # an unrelated change reuse the nearest prior cache rather than starting
      # cold.
      - name: Cache the Zig compiler cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/zig
            .zig-cache
          # The pin manifests are in the key so a vendored engine is rebuilt exactly once
          # when its pin changes and reused on every run in between; the content-addressed
          # cache elides the recompile (asserted by the engine-cache gate).
          key: zig-cache-${{ matrix.host }}-${{ hashFiles('build.zig', 'build.zig.zon', 'engines.lock.json', 'toolchain.lock.json') }}-${{ github.sha }}
          restore-keys: |
            zig-cache-${{ matrix.host }}-${{ hashFiles('build.zig', 'build.zig.zon', 'engines.lock.json', 'toolchain.lock.json') }}-
            zig-cache-${{ matrix.host }}-

      # Installs the pinned compiler and every pinned component, each verified
      # against the digest recorded in the manifest. Even on a cache hit the
      # archive digest is re-verified before extraction, so the cache never
      # substitutes for the verification.
      - name: Bootstrap the pinned toolchain
        run: tools/bootstrap/bootstrap.sh

      # The install location comes from bootstrap itself rather than being
      # recomputed here, so the two can never disagree about where it went.
      - name: Resolve the compiler onto PATH
        run: tools/bootstrap/bootstrap.sh --print-path >> "$GITHUB_PATH"

      - name: Confirm the running compiler is the pinned one
        run: zig version

      # Provision the pinned software Vulkan implementation (Mesa lavapipe) so the GPU device
      # adapter is verified headless and deterministically — no vendor variance, which suits
      # pixel-diff gates better than a real GPU. Linux only: it is the correctness lane. The
      # install is pinned and digest-verified against infrastructure/ci/vulkan-runtime.lock.json,
      # so a Mesa update cannot silently shift a rendered pixel. On success the script exports
      # VK_ICD_FILENAMES and REQUIRE_VULKAN_DEVICE (which makes the bring-up tests strict here);
      # the macOS lane, without an implementation, stays tolerant. Performance gates are hardware
      # gates and do not run against lavapipe.
      - name: Provision the pinned software Vulkan implementation (lavapipe)
        if: matrix.host == 'linux-x86_64'
        run: infrastructure/ci/provision-lavapipe.sh

      # The ALSA host-audio adapter links the system "asound" library, so the Linux lane needs its
      # development package present before the build. Linux only: it is the only lane that builds the
      # ALSA adapter — the macOS lane builds CoreAudio instead and never links asound. The macOS lane
      # skips this step, keeping the seam honest-until-bound there.
      - name: Install the ALSA development library (libasound)
        if: matrix.host == 'linux-x86_64'
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev

      # Cache the downloaded engine archives, not the extracted tree.
      #
      # Same argument as the toolchain-archive cache above: vendor-engines
      # re-hashes each archive against the SHA-256 pinned in engines.lock.json
      # on every run, whether the bytes came from this cache or a fresh
      # download, and drops a cache entry that fails. So a cache hit still
      # passes through the digest verification and a poisoned cache fails it —
      # the cache never substitutes for verification. Keyed on the manifest's
      # content, so a re-pin is a new entry; the restore-key reuses the nearest
      # prior archives when only some pins changed.
      - name: Cache the downloaded engine archives
        uses: actions/cache@v4
        with:
          path: .engine-archives
          key: engine-archives-${{ matrix.host }}-${{ hashFiles('engines.lock.json') }}
          restore-keys: |
            engine-archives-${{ matrix.host }}-

      # Fetch and verify the pinned graphics engines so the device adapters
      # (built only when their headers are present) are compiled and their
      # tests run in CI, catching a binding regression that a checkout without
      # the headers would skip. The digest is re-verified before extraction.
      - name: Vendor the pinned engines
        run: zig build vendor-engines

      # Release feeds rate limit anonymous callers, and a gate that fails on
      # rate limiting teaches people to ignore it. The token is read-only and
      # scoped to this run.
      - name: Run gates
        run: infrastructure/ci/gates.sh
        env:
          PLATFORM_RELEASE_FEED_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  specification-exclusion:
    name: specification is not committed
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out
        uses: actions/checkout@v5

      # The local-only policy is enforced through .git/info/exclude, which is
      # not pushed. This lane therefore asserts the outcome that matters: the
      # specification must not be present in repository history.
      - name: Assert the specification is untracked
        run: |
          if git ls-files --error-unmatch docs/PLATFORM_SPEC.md >/dev/null 2>&1; then
            echo "docs/PLATFORM_SPEC.md is tracked; the local-only policy forbids committing it" >&2
            exit 1
          fi
          echo "ok  docs/PLATFORM_SPEC.md is not tracked"

  commit-messages:
    name: commit messages read as human notes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out
        uses: actions/checkout@v5
        with:
          # The whole branch range is judged, so full history is needed.
          fetch-depth: 0

      # Every commit the pull request adds is checked for terse, human wording:
      # no attribution, subject discipline, and no generated-prose body. A branch
      # that reads as machine output is rejected before it can be squashed in.
      - name: Lint each commit message on the branch
        run: |
          base='${{ github.event.pull_request.base.sha }}'
          head='${{ github.event.pull_request.head.sha }}'
          status=0
          for commit in $(git rev-list "$base..$head"); do
            message=$(mktemp)
            git log -1 --format=%B "$commit" > "$message"
            printf '\n--- %s ---\n' "$(git log -1 --format='%h %s' "$commit")"
            # The commit-msg hook enforces subject discipline and no attribution,
            # and chains to the tone check, so one call covers every rule.
            infrastructure/development/hooks/commit-msg "$message" || status=1
          done
          exit $status
